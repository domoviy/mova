<!DOCTYPE html>
<html lang="uk" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d2b1a">
<title>MOVA</title>
<style>
:root{--forest:#0d2b1a;--leaf:#1e4a2c;--gold:#c9a84c;--cream:#f8f5ee;--ink:#1c1917;--warm:#44403c;--muted:#78716c;--border:#e7e3dc;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--cream);color:var(--ink);font:16px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
header{background:var(--forest);background-image:radial-gradient(ellipse at 35% 45%,rgba(201,168,76,.10),transparent 55%),radial-gradient(ellipse at 70% 60%,rgba(30,74,44,.5),transparent 50%);padding:36px 20px;display:flex;justify-content:center}
header svg{width:min(60vw,240px);height:auto}
@keyframes d{to{stroke-dashoffset:0}}
.p{fill:none;stroke:#c9a84c;stroke-width:35;stroke-linecap:round;stroke-linejoin:round;animation:d 1s ease-in-out forwards}
main{max-width:440px;margin:-18px auto 40px;padding:0 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:26px 22px;box-shadow:0 6px 24px rgba(13,43,26,.08)}
h1{margin:0 0 8px;font-size:21px;line-height:1.3}
p{margin:0 0 14px;color:var(--warm)}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--gold)}
button,.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--gold);color:var(--forest);font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;margin-top:12px;min-height:20px}
.ok{color:var(--leaf);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<svg viewBox="30 50 660 640" xmlns="http://www.w3.org/2000/svg" aria-label="MOVA">
<path class="p" style="stroke-dasharray:1400;stroke-dashoffset:1400;animation-duration:1.4s" d="M 50,385 L 194,212 C 231,252 277,296 297,280 S 355,152 370,168 C 388,200 424,272 441,258 C 460,228 577,90 658,76"/>
<path class="p" style="stroke-dasharray:650;stroke-dashoffset:650;animation-delay:1.5s;animation-duration:.5s" d="M 50,660 L 50,460 L 99,560 L 148,460 L 148,660"/>
<path class="p" style="stroke-dasharray:470;stroke-dashoffset:470;animation-delay:2s;animation-duration:.42s" d="M 297,477.5 A 59.5,82.5 0 0 1 356.5,560 A 59.5,82.5 0 0 1 297,642.5 A 59.5,82.5 0 0 1 237.5,560 A 59.5,82.5 0 0 1 297,477.5"/>
<path class="p" style="stroke-dasharray:430;stroke-dashoffset:430;animation-delay:2.4s;animation-duration:.38s" d="M 421.5,460 L 470.5,660 L 519.5,460"/>
<path class="p" style="stroke-dasharray:430;stroke-dashoffset:430;animation-delay:2.75s;animation-duration:.38s" d="M 560,660 L 609,460 L 658,660"/>
<path class="p" style="stroke-dasharray:70;stroke-dashoffset:70;animation-delay:3.1s;animation-duration:.13s" d="M 580.8,575 L 637.2,575"/>
</svg>
</header>
<main><div class="card">
<div id="load"><p class="muted" id="t-load"></p></div>
<form id="form" hidden>
  <h1 id="t-title"></h1>
  <p class="muted" id="t-acc"></p>
  <label for="p1" id="t-p1"></label><input id="p1" type="password" autocomplete="new-password" required>
  <label for="p2" id="t-p2"></label><input id="p2" type="password" autocomplete="new-password" required>
  <p class="muted" style="margin-top:10px" id="t-rules"></p>
  <div class="err" id="err" role="alert"></div>
  <button type="submit" id="go"></button>
</form>
<div id="done" hidden><h1 class="ok" id="t-done"></h1><p id="t-done2"></p><a class="btn" href="https://mova.now/" id="t-open"></a></div>
<div id="bad" hidden><h1 id="t-bad"></h1><p id="t-bad2"></p><a class="btn" href="https://mova.now/" id="t-open2"></a></div>
</div></main>
<script type="module">
const TX={
uk:{load:'Перевіряємо посилання…',title:'Новий пароль',acc:'Акаунт: ',p1:'Новий пароль',p2:'Повторіть пароль',rules:'Мінімум 8 символів, велика й мала літери, цифра та спецсимвол.',go:'Зберегти пароль',weak:'Пароль не відповідає вимогам: мінімум 8 символів, велика й мала літери, цифра та спецсимвол.',mism:'Паролі не збігаються.',done:'Пароль змінено',done2:'Тепер можна увійти в MOVA з новим паролем.',open:'Відкрити MOVA',bad:'Посилання недійсне',bad2:'Воно вже використане або застаріло. Поверніться в додаток і запросіть скидання пароля ще раз.',net:'Не вдалося зберегти. Перевірте з’єднання й спробуйте ще раз.'},
de:{load:'Link wird geprüft…',title:'Neues Passwort',acc:'Konto: ',p1:'Neues Passwort',p2:'Passwort wiederholen',rules:'Mindestens 8 Zeichen, Groß- und Kleinbuchstabe, Ziffer und Sonderzeichen.',go:'Passwort speichern',weak:'Das Passwort erfüllt die Anforderungen nicht: mindestens 8 Zeichen, Groß- und Kleinbuchstabe, Ziffer und Sonderzeichen.',mism:'Die Passwörter stimmen nicht überein.',done:'Passwort geändert',done2:'Sie können sich jetzt mit dem neuen Passwort bei MOVA anmelden.',open:'MOVA öffnen',bad:'Link ungültig',bad2:'Der Link wurde bereits verwendet oder ist abgelaufen. Fordern Sie in der App das Zurücksetzen erneut an.',net:'Speichern fehlgeschlagen. Prüfen Sie die Verbindung und versuchen Sie es erneut.'},
ru:{load:'Проверяем ссылку…',title:'Новый пароль',acc:'Аккаунт: ',p1:'Новый пароль',p2:'Повторите пароль',rules:'Минимум 8 символов, заглавная и строчная буквы, цифра и спецсимвол.',go:'Сохранить пароль',weak:'Пароль не соответствует требованиям: минимум 8 символов, заглавная и строчная буквы, цифра и спецсимвол.',mism:'Пароли не совпадают.',done:'Пароль изменён',done2:'Теперь можно войти в MOVA с новым паролем.',open:'Открыть MOVA',bad:'Ссылка недействительна',bad2:'Она уже использована или устарела. Вернитесь в приложение и запросите сброс пароля ещё раз.',net:'Не удалось сохранить. Проверьте соединение и попробуйте ещё раз.'},
en:{load:'Checking the link…',title:'New password',acc:'Account: ',p1:'New password',p2:'Repeat password',rules:'At least 8 characters, upper and lower case letters, a number and a special character.',go:'Save password',weak:'The password does not meet the requirements: at least 8 characters, upper and lower case letters, a number and a special character.',mism:'The passwords do not match.',done:'Password changed',done2:'You can now sign in to MOVA with your new password.',open:'Open MOVA',bad:'Invalid link',bad2:'It has already been used or has expired. Go back to the app and request a password reset again.',net:'Could not save. Check your connection and try again.'}};
const q=new URLSearchParams(location.search);
let l=(q.get('lang')||'').slice(0,2); if(!TX[l]){try{l=localStorage.getItem('mova_ui_lang')}catch(_){} } if(!TX[l]) l='de';
const t=TX[l]; document.documentElement.lang=l;
const $=id=>document.getElementById(id), show=id=>{['load','form','done','bad'].forEach(k=>$(k).hidden=k!==id)};
[['t-load','load'],['t-title','title'],['t-p1','p1'],['t-p2','p2'],['t-rules','rules'],['go','go'],['t-done','done'],['t-done2','done2'],['t-open','open'],['t-open2','open'],['t-bad','bad'],['t-bad2','bad2']].forEach(([i,k])=>$(i).textContent=t[k]);
const code=q.get('oobCode');
if(q.get('mode')!=='resetPassword'||!code){ show('bad'); }
else try{
  const B='https://www.gstatic.com/firebasejs/10.12.0/';
  const {initializeApp}=await import(B+'firebase-app.js');
  const {getAuth,verifyPasswordResetCode,confirmPasswordReset}=await import(B+'firebase-auth.js');
  const auth=getAuth(initializeApp({apiKey:'AIzaSyAxY0dxMiCDtpQBsDgrrOm2Q7tTZWfe98c',authDomain:'mova-b.firebaseapp.com',projectId:'mova-b'}));
  let email; try{ email=await verifyPasswordResetCode(auth,code); }catch(_){ show('bad'); throw 0; }
  $('t-acc').textContent=t.acc+email; show('form');
  const okPw=p=>p.length>=8&&/[a-zа-яіїєґäöüß]/.test(p)&&/[A-ZА-ЯІЇЄҐÄÖÜ]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9А-Яа-яІіЇїЄєҐґÄäÖöÜüß]/.test(p);
  $('form').addEventListener('submit',async e=>{
    e.preventDefault(); const a=$('p1').value, b=$('p2').value, er=$('err'); er.textContent='';
    if(a!==b){ er.textContent=t.mism; return; }
    if(!okPw(a)){ er.textContent=t.weak; return; }
    $('go').disabled=true;
    try{ await confirmPasswordReset(auth,code,a); show('done'); }
    catch(x){ const c=x&&x.code; if(c==='auth/expired-action-code'||c==='auth/invalid-action-code') show('bad'); else er.textContent=(c==='auth/password-does-not-meet-requirements'||c==='auth/weak-password')?t.weak:t.net; $('go').disabled=false; }
  });
}catch(_){ if(!$('bad').hidden===false && $('form').hidden) show('bad'); }
</script>
</body>
</html>
