name: Перевірка аудіо (діагностика обривів)

# Запускається ВРУЧНУ з вкладки "Actions" на GitHub — жодного bash
# на своєму комп'ютері не треба. Вкажи шляхи до файлів (через пробіл)
# у полі "file_paths", натисни "Run workflow", і результат з'явиться
# в логах цього прогону (Actions -> цей workflow -> останній run ->
# крок "Перевірити гучність по словах").
on:
  workflow_dispatch:
    inputs:
      file_paths:
        description: 'Шляхи до .mp3 файлів через пробіл (напр. audio/Deutsch-B2-Beruf/de/100/forum/forum_010_pro_de_100.mp3)'
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репо
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Встановити mutagen
        run: pip install mutagen

      - name: Встановити ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Перевірити тривалість/таймінг (duration vs words.json)
        run: python3 check_suspect_files.py ${{ inputs.file_paths }}

      - name: Перевірити гучність по словах (шукає тишу всередині файлу)
        run: python3 check_audio_energy.py ${{ inputs.file_paths }}
