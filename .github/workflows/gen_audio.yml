name: Generate TTS Audio

# Запускається автоматично ПІСЛЯ успішного завершення "Update SW Cache Version"
# (щоб генерація аудіо не конкурувала за ресурси з перевіркою/деплоєм
# файлів баз Deutsch-B2-Beruf.js та Financial-Accounting-Foundations.js),
# або вручну. Аудіо зберігається в Cloudflare R2 (див. job generate).
on:
  workflow_run:
    workflows: ['Update SW Cache Version']
    types:
      - completed
  workflow_dispatch:   # Ручний запуск

# Не даємо двом запускам (напр. ручному й автоматичному) одночасно
# писати в audio/ — це саме та ситуація, що призводила до застарілого
# manifest.json, конфліктів при pull --rebase і, як наслідок, повторної
# генерації вже готових файлів.
concurrency:
  group: gen-audio
  cancel-in-progress: false

jobs:
  # Легка перевірка ПЕРЕД важким джобом генерації: чи змінився в коміті,
  # що задеплоївся, хоч один файл, від якого реально залежить аудіо
  # (бази курсів "<COURSE>.js" + спільний characters.js). Оновлення
  # index.html, sw.js чи будь-чого іншого не додає нових карток/фраз для
  # озвучення — раніше в таких випадках generate все одно запускався й
  # проходив повний скрипт (checkout, install deps, скан усіх баз) лише
  # щоб дійти висновку "генерувати нічого", а це і є той довгий даремний
  # запуск, від якого ми тут відмовляємось.
  check-db-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # РАНІШЕ тут був fetch-depth: 0 (уся історія) — і саме це, а не
          # сама перевірка, займало >2хв: репозиторій має 44k+ аудіофайлів
          # у audio/, і "вся історія" тягне за собою кожну їхню стару
          # версію з кожного минулого коміту. Нам же для diff з батьком
          # потрібні лише 2 останні коміти (сам SHA + його прямий батько).
          fetch-depth: 2
          # filter:blob:none — не завантажуємо вміст файлів одразу (лише
          # дерева/коміти); git diff --name-only порівнює хеші дерев і
          # взагалі не потребує вмісту блобів.
          filter: blob:none
          # sparse-checkout — на диск матеріалізуємо лише кореневі *.js/
          # *.py (для читання COURSES із gen_audio.py нижче), а не весь
          # важезний audio/ (саме тому, заради чого й існує ця перевірка).
          sparse-checkout: |
            *.js
            *.py
          sparse-checkout-cone-mode: false

      - id: check
        name: Diff deployed commit against its parent
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"

          # Список файлів баз курсів беремо прямо з COURSES у gen_audio.py
          # (а не дублюємо вручну тут) — щоб при додаванні нового курсу в
          # скрипті цей перелік не розійшовся й сам собою лишався точним.
          COURSE_FILES=$(sed -n '/^COURSES = \[/,/\]/p' gen_audio.py \
            | grep -oE "'[^']+'" | tr -d "'" | sed 's/$/.js/')
          WATCH_FILES=$(printf 'characters.js\n%s' "$COURSE_FILES")
          echo "Файли, що впливають на аудіо:"
          echo "$WATCH_FILES"

          CHANGED=$(git diff --name-only "$SHA^" "$SHA" -- $WATCH_FILES)
          if [ -n "$CHANGED" ]; then
            echo "Змінились файли баз:"; echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Жодна база курсу/characters.js не змінилась — генерацію аудіо пропускаємо"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: check-db-changes
    runs-on: ubuntu-latest
    # Запускаємо, якщо це ручний запуск (завжди) АБО деплой (бамп версії)
    # завершився успішно І в задеплоєному коміті справді змінився хоч один
    # файл бази/characters.js (див. check-db-changes вище). Статусна функція
    # потрібна, бо check-db-changes навмисно пропускається (skip) для
    # workflow_dispatch, а без неї дефолтна поведінка GitHub Actions так
    # само пропустила б і generate, побачивши "потрібний job не success".
    # ⚠️ Саме !cancelled(), а НЕ always(): always() спрацьовує ЩЕ Й ПРИ
    # скасуванні запуску — тому кнопка "Cancel workflow" не зупиняла цей
    # job (він "ігнорував" скасування й продовжував генерацію). !cancelled()
    # дає ту саму поведінку для skip-у check-db-changes, але поважає Cancel.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        needs.check-db-changes.outputs.changed == 'true'))

    # З 13.11.2026 аудіо зберігається в Cloudflare R2 (TTS_STORAGE=r2, типовий режим
    # gen_audio.py), а не в репозиторії: job нічого не комітить, тож запис не потрібен.
    permissions:
      contents: read

    # Доступ rclone до R2 (віддалене сховище 'r2') — ті самі секрети, що були в
    # sync-audio-r2.yml. Рівень job: потрібні і генерації, і кроку збереження після Cancel.
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'

    steps:
      # Беремо саме задеплоєний коміт (для workflow_run) — аудіо генерується під
      # той контент, який зараз бачать користувачі. Теку audio/ НЕ завантажуємо:
      # маніфести gen_audio.py сам стягує з R2 (r2_pull_manifests), тож локальна
      # audio/ містить лише маніфести й щойно згенеровані файли — це й робить
      # швидким крок збереження після Cancel нижче. Історія git теж не потрібна.
      - name: Checkout repository (без audio/ і data/)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/audio/
            !/data/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install edge-tts mutagen

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      # Якщо ключі R2 не підхопились — падаємо тут, до генерації, з явною помилкою.
      - name: Перевірка доступу до R2
        run: rclone lsf r2:mova-audio --max-depth 1

      # Один потік із паузою 1.2с між запитами (менше ризик rate-limit від Edge TTS);
      # проміжна заливка в R2 — пачками по 5 файлів (маленьке вікно ризику втрати прогресу).
      - name: Generate audio files
        env:
          TTS_STORAGE: r2
          TTS_WORKERS: '1'
          TTS_DELAY: '1.2'
          TTS_COMMIT_LIMIT: '5'
        run: python gen_audio.py

      # ЗБЕРЕЖЕННЯ ПІСЛЯ СКАСУВАННЯ: при натисканні "Cancel workflow" скрипт за секунди
      # завершується з кодом 130, не заливши останню пачку. Усе вже згенероване (mp3 +
      # шарди маніфесту, записані атомарно) лежить на диску в audio/ — доливаємо його в R2.
      # Порядок той самий, що в gen_audio.py: спершу mp3 і .words.json, потім маніфести,
      # щоб маніфест ніколи не посилався на файл, якого ще немає в R2.
      # ⚠️ Лише rclone COPY, не sync: локальна audio/ — не повна копія бакета.
      - name: Save progress after cancel
        if: cancelled()
        run: |
          if [ ! -d audio ]; then
            echo "Теки audio/ немає — зберігати нічого."
            exit 0
          fi
          rclone copy audio r2:mova-audio/audio \
            --checksum --transfers 8 --retries 3 \
            --exclude "manifest.json" --exclude "index.json" \
            --header-upload "Cache-Control: public, max-age=600" -v
          rclone copy audio r2:mova-audio/audio \
            --checksum --transfers 8 --retries 3 \
            --include "manifest.json" --include "index.json" \
            --header-upload "Cache-Control: no-cache" -v
