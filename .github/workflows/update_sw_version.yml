name: Update SW Cache Version

# Запускається при кожному пуші у main (крім пушів від самого бота)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'audio/**'   # аудіо-файли не потребують оновлення кешу SW

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# ОДНА ВЕРСІЯ НА ПАЧКУ ЗАВАНТАЖЕНЬ. Кожне завантаження файлів через сайт GitHub — окремий
# коміт, і раніше кожен давав нову версію: застосунок у людей оновлювався 3–4 рази поспіль
# («є оновлення» → перезапуск → знову «є оновлення»). Тепер новий пуш скасовує попередній
# запуск, що ще чекає (cancel-in-progress), а сам запуск спершу чекає 3 хв тиші (крок «Debounce»).
# Версію ставить лише останній запуск пачки — одне оновлення замість кількох.
concurrency:
  group: sw-version-bump
  cancel-in-progress: true

jobs:
  bump-sw-version:
    runs-on: ubuntu-latest
    # Не запускаємось якщо це пуш від github-actions[bot] (щоб не зациклитись)
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      # Чекаємо, поки закінчиться пачка завантажень: якщо за цей час прийде ще один пуш,
      # цей запуск скасується (concurrency вище), і версію поставить наступний.
      - name: Debounce
        run: sleep 180

      # Лише останній коміт: повна історія (fetch-depth: 0) тягнула всю стару
      # теку audio/ і займала більшу частину ~2 хв запуску. Для бампа версії й
      # push історія не потрібна.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Git Bot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # КІЛЬКА ПУШІВ ПОСПІЛЬ (завантаження файлів у різні теки через сайт GitHub
      # = окремий коміт на кожну теку) запускають кілька копій цього workflow
      # паралельно. Раніше друга копія падала на git push (гілка вже пішла вперед)
      # і приходив лист "All jobs have failed". Тепер при відмові push беремо
      # свіжий main, заново ставимо версію й пробуємо ще раз (до 5 спроб).
      - name: Bump versions and push
        run: |
          # Версія = номер запуску + короткий SHA: напр. 142-a1b2c3d
          NEW_VERSION="${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Нова версія: $NEW_VERSION"

          for attempt in 1 2 3 4 5; do
            sed -i "s|const CACHE_VERSION = '.*';|const CACHE_VERSION = '${NEW_VERSION}';|" sw.js
            sed -i "s|const APP_VERSION = '.*';|const APP_VERSION = '${NEW_VERSION}';|" index.html
            grep "CACHE_VERSION" sw.js | head -1
            grep -o "const APP_VERSION = '[^']*';" index.html

            git add sw.js index.html
            if git diff --staged --quiet; then
              echo "Версії не змінились — пропускаємо коміт"
              exit 0
            fi
            git commit -q -m "⚙️ Version bump to ${NEW_VERSION} [skip ci]"

            if git push origin HEAD:main; then
              echo "Готово (спроба $attempt)"
              exit 0
            fi

            echo "Push відхилено: main змінився. Беремо свіжий main і повторюємо..."
            sleep $((attempt * 3))
            git fetch -q --depth=1 origin main
            git reset -q --hard origin/main
          done

          echo "Не вдалося запушити після 5 спроб"
          exit 1
